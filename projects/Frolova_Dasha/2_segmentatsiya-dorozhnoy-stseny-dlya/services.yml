name: scene-segmentation

services:
  api:
    build: .
    command: ["uvicorn", "api:api", "--host", "0.0.0.0", "--port", "8012"]
    environment:
      PRODUCTION_MODE: "true"
      ANALYTICS_TABLE: scene_analytics
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      DATABASE_URL: postgresql://scene:scene@postgres:5432/scene
    ports: ["8012:8012"]
    depends_on:
      kafka: { condition: service_healthy }
      minio: { condition: service_healthy }
      postgres: { condition: service_healthy }
  worker:
    build: .
    command: ["python", "worker.py"]
    environment:
      PRODUCTION_MODE: "true"
      ANALYTICS_TABLE: scene_analytics
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      DATABASE_URL: postgresql://scene:scene@postgres:5432/scene
    depends_on:
      kafka: { condition: service_healthy }
      minio: { condition: service_healthy }
      postgres: { condition: service_healthy }
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck: { test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:9092 --list"], interval: 10s, timeout: 5s, retries: 12, start_period: 20s }
  minio:
    image: lr2-minio-official:RELEASE.2024-10-13T13-34-11Z
    build:
      context: .
      dockerfile: Dockerfile.minio
      args: { MINIO_TAG: RELEASE.2024-10-13T13-34-11Z }
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    ports: ["9000:9000", "9001:9001"]
    healthcheck: { test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"], interval: 10s, timeout: 5s, retries: 10 }
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: scene, POSTGRES_USER: scene, POSTGRES_PASSWORD: scene }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U scene -d scene"], interval: 5s, timeout: 3s, retries: 10 }
