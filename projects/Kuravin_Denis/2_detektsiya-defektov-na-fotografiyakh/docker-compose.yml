version: '3.8'

services:
  cardamage-api:
    build: .
    container_name: cardamage-api
    ports:
      - "8001:8001"
    environment:
      - ENVIRONMENT=production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=cardamage
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    depends_on:
      - postgres
      - minio
    networks:
      - cardamage-net

  postgres:
    image: postgres:16-alpine
    container_name: cardamage-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=cardamage
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - cardamage-net

  minio:
    image: minio/minio:RELEASE.2023-10-25T06-33-25Z
    container_name: cardamage-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    networks:
      - cardamage-net

networks:
  cardamage-net:
    driver: bridge

volumes:
  pgdata:
  miniodata:
