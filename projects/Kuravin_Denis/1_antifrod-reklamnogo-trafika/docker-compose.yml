version: '3.8'

services:
  antifraud-api:
    build: .
    container_name: antifraud-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - REDIS_URL=redis://redis:6379/0
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
    depends_on:
      - redis
      - kafka
      - clickhouse
    networks:
      - antifraud-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: antifraud-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - antifraud-net

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: antifraud-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - antifraud-net

  redis:
    image: redis:7.2-alpine
    container_name: antifraud-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    networks:
      - antifraud-net

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: antifraud-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: antifraud
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - antifraud-net

  grafana:
    image: grafana/grafana:10.2.0
    container_name: antifraud-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - clickhouse
    networks:
      - antifraud-net

networks:
  antifraud-net:
    driver: bridge
