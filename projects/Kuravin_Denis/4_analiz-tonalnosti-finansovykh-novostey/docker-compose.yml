version: '3.8'

services:
  sentiment-api:
    build: .
    container_name: sentiment-api
    ports:
      - "8003:8003"
    environment:
      - ENVIRONMENT=production
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
    depends_on:
      - kafka
      - clickhouse
      - elasticsearch
    networks:
      - sentiment-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: sentiment-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - sentiment-net

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: sentiment-kafka
    ports:
      - "9095:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - sentiment-net

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: sentiment-clickhouse
    ports:
      - "8125:8123"
    environment:
      CLICKHOUSE_DB: finance_analytics
    networks:
      - sentiment-net

  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: sentiment-elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    networks:
      - sentiment-net

networks:
  sentiment-net:
    driver: bridge
